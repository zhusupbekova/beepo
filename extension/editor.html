<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="edTitle">Beepo</title>
    <link rel="stylesheet" href="ui/ui.css" />
    <style>
      body { padding: 24px; }
      main { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
      #grid { border: 3px solid var(--ink); cursor: crosshair; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
      .side { display: flex; flex-direction: column; gap: 10px; width: 280px; }
      .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
      .sw { height: 28px; border: 2px solid var(--ink); cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; box-shadow: none; padding: 0; }
      .sw.on { outline: 3px solid var(--gold); outline-offset: 1px; }
      .preview { display: flex; gap: 8px; align-items: flex-end; padding: 8px; background: var(--paper); border: 2px solid var(--ink); }
      .customs .row { padding: 3px 0; }
      .hint { font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1 style="margin-bottom: 4px" data-i18n="edTitle"></h1>
    <p class="hint" data-i18n="edHint"></p>
    <main>
      <canvas id="grid"></canvas>
      <div class="side">
        <div class="box">
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="box">
          <label class="field"><span data-i18n="edName"></span> <input id="name" data-i18n-placeholder="edNamePh" /></label>
          <label class="field" style="margin-top: 6px"><span data-i18n="edSlot"></span>
            <select id="slot"><option value="hat" data-i18n="edSlotHat"></option><option value="accessory" data-i18n="edSlotAccessory"></option><option value="antenna" data-i18n="edSlotAntenna"></option></select>
          </label>
          <label class="field" style="margin-top: 6px"><span data-i18n="edStart"></span>
            <select id="base"><option value="" data-i18n="edBlank"></option></select>
          </label>
          <div class="row" style="margin-top: 8px">
            <button id="save" data-i18n="edSave"></button>
            <button id="copy" class="ghost" data-i18n-title="edCopyTitle" data-i18n="edCopy"></button>
            <button id="clear" class="ghost" data-i18n="edClear"></button>
          </div>
          <div class="hint" id="msg"></div>
        </div>
        <div class="box">
          <h2 data-i18n="edPreview"></h2>
          <div class="preview" id="preview"></div>
        </div>
        <div class="box customs">
          <h2 data-i18n="edCreations"></h2>
          <div id="customs"></div>
        </div>
      </div>
    </main>
    <script src="render/sprite.js"></script>
    <script type="module" src="ui/editor.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui/ui.css" />
    <link rel="stylesheet" href="ui/popup.css" />
  </head>
  <body>
    <header>
      <canvas id="beepo"></canvas>
      <div class="grow">
        <h1>Beepo</h1>
        <div class="muted" id="streak"></div>
      </div>
      <span class="stars" id="stars">⭐ 0</span>
      <button class="icon" id="openOptions" data-i18n-title="settings">⚙</button>
    </header>

    <nav>
      <button data-tab="today" class="on" data-i18n="tab_today"></button>
      <button data-tab="report" data-i18n="tab_report"></button>
      <button data-tab="shop" data-i18n="tab_shop"></button>
      <button data-tab="badges" data-i18n="tab_badges"></button>
    </nav>

    <section id="tab-today">
      <div class="box" id="quick">
        <div class="row">
          <b class="grow" id="quickDomain"></b>
          <span class="muted" data-i18n="quickLimit"></span>
          <button data-min="15">15</button>
          <button data-min="30">30</button>
          <button data-min="60">60</button>
        </div>
        <button class="ghost linkish" id="customBtn" data-i18n="customRule"></button>
      </div>
      <div id="suggestions"></div>
      <form class="box" id="editor" hidden></form>
      <div class="box" id="list"></div>
    </section>

    <section id="tab-report" hidden></section>
    <section id="tab-shop" hidden></section>
    <section id="tab-badges" hidden></section>

    <script src="render/sprite.js"></script>
    <script type="module" src="ui/popup.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optTitle">Beepo</title>
    <link rel="stylesheet" href="ui/ui.css" />
    <style>
      body { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
      .hint { font-size: 11px; color: var(--muted); }
      .saved { color: #2a8a55; min-height: 1em; }
      .row { flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header>
      <canvas id="beepo"></canvas>
      <div>
        <h1 data-i18n="optTitle"></h1>
        <div class="saved" id="saved"></div>
      </div>
    </header>

    <div class="box">
      <h2>Beepo</h2>
      <form id="settings">
        <label class="field"><span data-i18n="language"></span>
          <select name="lang"><option value="auto" data-i18n="langAuto"></option></select>
        </label>
        <div></div>
        <label class="field"><span data-i18n="homeCorner"></span>
          <select name="side"><option value="right" data-i18n="bottomRight"></option><option value="left" data-i18n="bottomLeft"></option></select>
        </label>
        <label class="field"><span data-i18n="size"></span>
          <select name="scale"><option value="3" data-i18n="small"></option><option value="4" data-i18n="medium"></option><option value="5" data-i18n="large"></option></select>
        </label>
        <label class="field"><span data-i18n="nagEvery"></span>
          <input name="nagMinutes" type="number" min="0" max="60" />
          <span class="hint" data-i18n="nagHint"></span>
        </label>
        <label class="field"><span data-i18n="newDay"></span>
          <select name="resetHour"></select>
          <span class="hint" data-i18n="newDayHint"></span>
        </label>
        <label class="field"><span data-i18n="idle"></span>
          <input name="idleSeconds" type="number" min="15" max="3600" />
          <span class="hint" data-i18n="idleHint"></span>
        </label>
        <div></div>
        <label class="check"><input type="checkbox" name="wander" /> <span data-i18n="wander"></span></label>
        <label class="check"><input type="checkbox" name="sound" /> <span data-i18n="sounds"></span></label>
        <label class="check"><input type="checkbox" name="quiet" /> <span data-i18n="quiet"></span></label>
        <label class="check"><input type="checkbox" name="everywhere" /> <span data-i18n="everywhere"></span></label>
      </form>
    </div>

    <div class="box">
      <h2 data-i18n="yourData"></h2>
      <p class="hint" data-i18n="dataHint"></p>
      <div class="row">
        <button id="export" data-i18n="export"></button>
        <button id="import" class="ghost" data-i18n="import"></button>
        <input type="file" id="file" accept="application/json" hidden />
        <a href="editor.html" data-i18n="spriteEditor"></a>
      </div>
    </div>

    <script src="render/sprite.js"></script>
    <script type="module" src="ui/options.js"></script>
  </body>
</html>
